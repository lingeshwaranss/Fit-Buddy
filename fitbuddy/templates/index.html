<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy – AI Workout Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.88)),
                  url('/static/images/gym-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #0f172a;
    }
    .top-nav {
      position: absolute;
      top: 20px;
      right: 24px;
    }
    .admin-link {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    .admin-link:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #38bdf8;
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      padding: 36px 32px;
      backdrop-filter: blur(12px);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .title-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .title-box h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #1e293b;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #f8fafc;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }
    .footer-text {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="/view-all-users" class="admin-link">📊 Admin Dashboard</a>
  </div>

  <div class="card">
    <div class="title-box">
      <span style="font-size: 26px;">💪</span>
      <h1>FitBuddy - AI Workout Generator</h1>
    </div>

    <form action="/generate-workout" method="POST">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="user_id">User ID:</label>
        <input type="number" id="user_id" name="user_id" placeholder="e.g. 10 or 101" required>
      </div>

      <div class="form-group">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="10" max="100" placeholder="e.g. 25" required>
      </div>

      <div class="form-group">
        <label for="weight">Weight (kg):</label>
        <input type="number" step="0.1" id="weight" name="weight" placeholder="e.g. 70.0" required>
      </div>

      <div class="form-group">
        <label for="goal">Fitness Goal:</label>
        <input type="text" id="goal" name="goal" placeholder="e.g., weight loss, muscle gain, lose belly fat" required>
      </div>

      <div class="form-group">
        <label for="intensity">Workout Intensity:</label>
        <select id="intensity" name="intensity" required>
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Generate Plan</button>
    </form>

    <p class="footer-text">Powered by Google Gemini 1.5 Pro & Flash AI Models</p>
  </div>
</body>
</html>
